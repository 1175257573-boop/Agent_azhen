name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一个 PR 的多次推送只保留最新一次，省 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 是 LangChain 1.x 的最低要求，3.12 是本项目实际使用的版本
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "ruff>=0.16,<0.17"

      - name: 静态检查 (ruff)
        # --output-format=github：让每条违规直接变成 PR/运行页上的注解，
        # 而不是淹没在日志里（日志对公开仓库需要 admin 权限才拿得到）
        run: ruff check . --output-format=github

      - name: 单元测试 (pytest)
        # 刻意不启动 Redis / PostgreSQL、不配置任何 API Key：
        # 测试套件必须能独立跑通，这也是 conftest.py 强制清理环境变量的原因。
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q

  smoke:
    name: 离线演示冒烟
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # fake provider 是离线脚本模型，不需要任何 Key；
      # demo 默认走内存记忆后端，因此也不需要 Redis / PostgreSQL。
      - name: 跑全部演示场景
        run: python main.py demo -p fake

      - name: Multi-Agent 防护演示（跑偏 / 循环拦截）
        run: python main.py guards

      # 只跑离线自检：验证「评估器判得准」，不调用真实模型
      - name: Agent 效果评估（离线自检，含故意失败用例）
        run: python main.py eval --show-all

      - name: 语义检索演示（字面匹配 vs 语义检索，离线降级路径）
        run: python main.py retrievers

      - name: MCP Server 协议连通（4 个 server / 21 个工具）
        run: python examples/mcp_servers_demo.py

      - name: 装配全部运行模式
        run: |
          python - <<'PY'
          from agent_kit.app import MODE_HELP, AppConfig, build_app
          for mode in MODE_HELP:
              if mode == "mcp":
                  continue  # mcp 需异步装配并 fork 本地 Server，CI 里跳过
              build_app(AppConfig(provider="fake", mode=mode, thread_id=f"ci-{mode}"))
              print(f"  ok: {mode}")
          PY
