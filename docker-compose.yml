# 记忆层依赖的两个外部服务 —— 推荐走容器（镜像自带 RedisJSON 模块）。
# 用法与环境变量配置见 README 第 5.1 节。
#
# ⚠️ 安全提醒：下面 postgres 的 atlas/atlas 是【本地开发默认凭据】，
#    仅限 127.0.0.1 调试使用。任何共享网络 / 公网 / 生产环境都必须改掉，
#    并且不要直接把 5432、6379 端口暴露出去。详见 SECURITY.md。
#
# 用法：docker compose up -d        （首次会拉镜像，约 1-2 分钟）
#       docker compose ps           （两个都 healthy 再启动 Agent）
#       docker compose down -v      （连数据一起清掉）
#
# 起好之后在系统里配两个环境变量（新开终端生效）：
#   setx REDIS_URL "redis://localhost:6379/0"
#   setx PG_DSN    "postgresql://atlas:atlas@localhost:5432/atlas"

services:
  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    # 追加 --save 60 1 让 Redis 定期落盘，纯缓存场景可以去掉这一行
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - atlas-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  atlas-redis-data:
  atlas-pg-data:
